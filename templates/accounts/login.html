{% extends "base.html" %}
{% block title %}Log in · Kundalik+{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card kp-card p-4 mt-4">
      <h1 class="h4 mb-3">Kundalik<span class="text-primary">+</span></h1>
      <p class="text-muted small">Log in with the username and password your school gave you.</p>
      {% if form.errors %}
        <div class="alert alert-danger">Incorrect username or password.</div>
      {% endif %}
      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label" for="id_username">Username</label>
          <input type="text" name="username" id="id_username" class="form-control" autofocus required>
        </div>
        <div class="mb-3">
          <label class="form-label" for="id_password">Password</label>
          <input type="password" name="password" id="id_password" class="form-control" required>
        </div>
        <button class="btn btn-primary w-100" type="submit">Log in</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
